# =============================================================================
# NOT USED BY THIS LAB — REFERENCE ONLY
# =============================================================================
#
# This file is an early draft using mod_proxy to forward all traffic to the
# controller's HTTP port (localhost:9080). It is INCORRECT for Liberty dynamic
# routing and is NOT included by any script or httpd.conf in this lab.
#
# Dynamic routing in this lab is implemented via the WAS plugin:
#   mod_was_ap24_http.so  +  plugin-cfg.xml
#
# The plugin contacts the controller's HTTPS /wr endpoint (port 9443) to
# retrieve the live routing table, then routes directly to member HTTP ports
# (9081–9084). No mod_proxy is involved.
#
# The correct Apache config for this lab is:
#   config/apache/httpd-liberty.conf    — loads the WAS plugin
#   scripts/step1-was-plugin.sh         — writes the static plugin-cfg.xml
#   scripts/step2-dynamic-routing.sh    — generates the dynamic plugin-cfg.xml
#
# Why this file is wrong:
#   - ProxyPass to localhost:9080 would create a single-point proxy to the
#     controller's HTTP port, bypassing the WAS plugin entirely.
#   - The controller does not serve application traffic on port 9080 in this
#     lab — members do (ports 9081–9084).
#   - mod_proxy_module is not loaded in the lab's httpd.conf (commented out).
#
# =============================================================================

# ProxyRequests Off
# ProxyPreserveHost On
# ProxyPass        "/balancer-manager" "!"
# ProxyPass        "/"  "http://localhost:9080/" nocanon
# ProxyPassReverse "/"  "http://localhost:9080/"

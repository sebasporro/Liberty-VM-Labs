# =============================================================================
# Liberty Collective — Apache HTTP Server Front-End Configuration
# Include this file from your main httpd.conf:
#   Include /home/itzuser/Liberty-VM-Labs/config/apache/httpd-liberty.conf
#
# This IHS archive install does NOT include mod_proxy_balancer.so or
# mod_lbmethod_byrequests.so, so the balancer:// scheme cannot be used.
#
# Required modules (all present in this IHS archive):
#   LoadModule proxy_module      modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#
# For true load balancing across all four members, use the WAS plugin approach:
#   LoadModule was_ap24_module   modules/mod_was_ap24_http.so
#   and configure plugin-cfg.xml (generated by scripts/08-enable-apache-routing.sh)
# =============================================================================

ProxyRequests     Off
ProxyPreserveHost On

# Exclude /server-status from proxying
ProxyPass        "/server-status"  "!"

# Per-member direct routes — useful for targeted testing
ProxyPass        "/member1/"  "http://localhost:9081/"  nocanon
ProxyPassReverse "/member1/"  "http://localhost:9081/"

ProxyPass        "/member2/"  "http://localhost:9082/"  nocanon
ProxyPassReverse "/member2/"  "http://localhost:9082/"

ProxyPass        "/member3/"  "http://localhost:9083/"  nocanon
ProxyPassReverse "/member3/"  "http://localhost:9083/"

ProxyPass        "/member4/"  "http://localhost:9084/"  nocanon
ProxyPassReverse "/member4/"  "http://localhost:9084/"

# Default catch-all — routes to member1 as primary
# For full round-robin load balancing, configure the WAS plugin instead
ProxyPass        "/"  "http://localhost:9081/"  nocanon
ProxyPassReverse "/"  "http://localhost:9081/"

# ---------------------------------------------------------------------------
# Server status — restricted to localhost
# ---------------------------------------------------------------------------
<Location "/server-status">
    SetHandler  server-status
    Require ip  127.0.0.1
    Require ip  ::1
</Location>

# =============================================================================
# Liberty Collective — Apache HTTP Server Front-End Configuration
# Include this file from your main httpd.conf:
#   Include /Users/sebastianporro/Documents/2026/ITZ/Liberty-VM-Labs/config/apache/httpd-liberty.conf
#
# Required modules (ensure these LoadModule lines are active in httpd.conf):
#   LoadModule proxy_module           libexec/apache2/mod_proxy.so
#   LoadModule proxy_balancer_module  libexec/apache2/mod_proxy_balancer.so
#   LoadModule proxy_http_module      libexec/apache2/mod_proxy_http.so
#   LoadModule lbmethod_byrequests_module libexec/apache2/mod_lbmethod_byrequests.so
#   LoadModule slotmem_shm_module     libexec/apache2/mod_slotmem_shm.so
#
# Homebrew Apache module paths:
#   Apple Silicon: /opt/homebrew/lib/httpd/modules/
#   Intel:         /usr/local/lib/httpd/modules/
# =============================================================================

# ---------------------------------------------------------------------------
# Load balancer cluster definition
# All four Liberty member servers across both versions:
#   member1 (9081) — Liberty 26.0.0.8 ND
#   member2 (9082) — Liberty 26.0.0.8 ND
#   member3 (9083) — Liberty 25.0.0.1 Base
#   member4 (9084) — Liberty 25.0.0.1 Base
# route= values must match the Liberty server names for sticky session routing
# ---------------------------------------------------------------------------
<Proxy "balancer://libertycluster">
    BalancerMember "http://localhost:9081" route=member1 loadfactor=1
    BalancerMember "http://localhost:9082" route=member2 loadfactor=1
    BalancerMember "http://localhost:9083" route=member3 loadfactor=1
    BalancerMember "http://localhost:9084" route=member4 loadfactor=1

    # Load balancing method: distribute requests evenly by count
    ProxySet lbmethod=byrequests

    # Sticky sessions: Liberty appends .routeId to JSESSIONID
    # Apache reads this suffix to pin subsequent requests to the same member
    ProxySet stickysession=JSESSIONID|jsessionid
</Proxy>

# ---------------------------------------------------------------------------
# Reverse proxy rules — forward all traffic to the balancer cluster
# ---------------------------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On

# Exclude /balancer-manager from being proxied — must come before the catch-all
ProxyPass "/balancer-manager" "!"

ProxyPass        "/"  "balancer://libertycluster/" nocanon
ProxyPassReverse "/"  "balancer://libertycluster/"

# ---------------------------------------------------------------------------
# Balancer Manager — live cluster status and weight adjustment UI
# Restricted to localhost only for security
# Access at: http://localhost:8080/balancer-manager
# ---------------------------------------------------------------------------
<Location "/balancer-manager">
    SetHandler balancer-manager
    Require ip 127.0.0.1
    Require ip ::1
</Location>

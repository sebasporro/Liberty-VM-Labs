# =============================================================================
# Liberty Collective — IHS WAS Plugin Front-End Configuration
# Include this file from your main httpd.conf:
#   Include /home/itzuser/Liberty-VM-Labs/config/apache/httpd-liberty.conf
#
# Routing is handled entirely by mod_was_ap24_http.so (WAS plugin).
# The plugin reads plugin-cfg.xml and forwards requests to the Liberty
# collective controller, which dynamically routes to available members.
#
# Required module (present in this IHS archive):
#   LoadModule was_ap24_module modules/mod_was_ap24_http.so
#
# No mod_proxy, mod_proxy_balancer, or mod_proxy_http needed.
# =============================================================================

# Point the WAS plugin at the plugin configuration file.
# The controller acts as dynamic router — it forwards to available members.
WebSpherePluginConfig /home/itzuser/Liberty-VM-Labs/config/apache/plugin-cfg.xml
